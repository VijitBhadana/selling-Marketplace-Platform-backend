name: Build check

# The backend is hosted on Render, which deploys every push to main on its own
# (Render's GitHub integration). This workflow only checks that the code builds,
# so a broken push shows up red here. It no longer deploys anywhere.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # DATABASE_URL is required for `prisma generate` to parse the schema, but
      # the client is generated from the schema alone, so a placeholder is fine
      # and no real credentials are needed at build time.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db

      - name: Build
        run: npm run build

      - name: Verify the entry point exists
        # nest emits dist/src/main.js here; catch it at build time rather than
        # discovering it from a crash loop on the server.
        run: test -f dist/src/main.js
